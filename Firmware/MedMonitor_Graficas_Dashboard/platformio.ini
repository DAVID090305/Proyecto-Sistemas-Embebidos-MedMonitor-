[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; LittleFS es donde van a vivir los 9 archivos MP3 (carpeta data/ del proyecto)
; Es mas rapido leyendo archivos que SPIFFS, lo cual ayuda a que el audio no
; se corte al reproducirse.
board_build.filesystem = littlefs

; Sin esto, el ESP32 reserva memoria para 2 particiones de programa (para
; poder hacer actualizaciones OTA), lo que deja muy poco espacio para los
; archivos de audio. Como no usamos OTA, "no_ota.csv" le da esa memoria
; extra a SPIFFS en su lugar (bastante mas espacio para los MP3).
board_build.partitions = no_ota.csv

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X
    adafruit/Adafruit MLX90614 Library
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6